name: Feature Request
description: Suggest a new feature or improvement for HoldIt
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for HoldIt? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem does this feature solve? Why do you want it?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've thought about.
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Mockups, references, or anything else.
    validations:
      required: false
